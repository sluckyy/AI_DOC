name: Build images
# Builds Dr Sam's two container images on every push to main and publishes them
# to GitHub's container registry. The Azure template pulls them by name; the
# packages must be public (or the container apps need registry credentials).
on:
  push:
    branches: [main]
    paths: [backend/**, content/**, frontend/**, .github/workflows/images.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: aidoc-api
            dockerfile: backend/Dockerfile
          - name: aidoc-web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
