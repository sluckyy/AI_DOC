# Adult fever is sepsis recognition. The agent collects the NICE history criteria and routes; it never assigns a sepsis risk category.
module: fever_sepsis
display_name: fever or feeling feverish
version: 0.1.0
status: grounded
reviewed: false
review_notes: ["Urine-output question wording (clock time then count)", "Whether SA Health uses NICE or local sepsis criteria (configurable parameter, not yet set)", "Whether rigors alone should fire a flag", "Wording given to a caller at home on an immediate-tier flag needs emergency medicine review", "Closing block is a first draft"]
setting: both
activates_on:
  terms: [fever, feverish, temperature, high temperature, burning up, shivers, shivering, chills, sweats, hot and cold, running a temperature, shaking]
slots:
  - id: fs.duration_pattern
    class: coverage
    required: true
    intent: how long the fever has been present and its pattern, in the patient's words
    phrasings:
      - {id: p1, form: open, text: "How long have you been feverish? Is it there all the time, or does it come and go?"}
    value: {type: text}
    verbatim: true
    negative_reporting: omit
  - id: fs.rigors
    class: coverage
    required: true
    intent: rigors or uncontrollable shaking with the fever
    phrasings:
      - {id: p1, form: closed, text: "Have you had bouts of uncontrollable shaking or teeth-chattering shivers with it?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", shaking, shakes, rigors, teeth chattering, shivering fits, couldn't stop shaking, whole body shaking], no_terms: ["no", no shaking, just hot, just sweaty, nothing like that]}
    verbatim: true
    negative_reporting: explicit
  - id: fs.urine_last_pass
    class: coverage
    required: true
    intent: clock time of the last pass of urine, confirmed as an interval; the 12- and 18-hour thresholds need an absolute time
    phrasings:
      - {id: p1, form: open, text: "When did you last pass urine? I need a clock time, even roughly, not just how long ago."}
    value: {type: clock_time}
    absolute_time: true
    verbatim: true
    negative_reporting: omit
  - id: fs.urine_count_since_yesterday
    class: coverage
    required: true
    intent: urine output as a count against time, never as "passing urine normally"
    phrasings:
      - {id: p1, form: open, text: "How many times have you passed urine since yesterday?"}
    value: {type: text}
    verbatim: true
    negative_reporting: omit
  - id: fs.urine_18h
    class: red_flag
    required: true
    intent: confirmed interval of 18 hours or more since the last pass of urine, derived from the clock time and read back to the patient
    phrasings:
      - {id: p1, form: closed, text: "From the time you gave me, that would be more than 18 hours since you last passed urine. Is that right?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", that's right, correct, about that, more than that, longer, all day, since yesterday morning], no_terms: ["no", less than that, sooner, went since then, this morning, a few hours ago]}
    prefill_from: [fs.urine_last_pass]
    confirm: true
    verbatim: true
    negative_reporting: explicit
  - id: fs.collateral_behaviour
    class: red_flag
    required: true
    intent: new altered behaviour or mental state reported by a friend or relative; a positive routes to the confusion module's collateral interview
    phrasings:
      - {id: p1, form: closed, text: "Is there someone with you? Have they said you seem more muddled, drowsy or not yourself since this started?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", muddled, confused, drowsy, not myself, not herself, not himself, rambling, not making sense, out of it], no_terms: ["no", nobody with me, same as usual, thinking clearly, nothing like that]}
    verbatim: true
    negative_reporting: explicit
  - id: fs.functional_deterioration
    class: coverage
    required: true
    intent: acute deterioration of functional ability, a NICE history criterion
    phrasings:
      - {id: p1, form: closed, text: "Compared with a few days ago, has there been a sudden change in how you are managing: getting about, washing, dressing, getting up from a chair?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", can't get up, can't stand, stuck in bed, can't manage, too weak, needs help now], no_terms: ["no", managing fine, same as usual, getting about, no change]}
    verbatim: true
    negative_reporting: explicit
  - id: fs.recent_presentations
    class: coverage
    required: true
    intent: whether the patient has already seen a GP or hospital about this illness, and when, by date, recorded verbatim
    phrasings:
      - {id: p1, form: open, text: "Have you already seen a doctor, or been to a hospital, about this illness? On what dates?"}
    value: {type: text}
    verbatim: true
    negative_reporting: explicit
  - id: fs.immunosuppressed
    class: red_flag
    required: true
    intent: impaired immune system, asked by drug name including oral steroids, plus chemotherapy, transplant, splenectomy and HIV
    phrasings:
      - {id: p1, form: closed, text: "Do you take anything that lowers your immune system: steroid tablets such as prednisolone, chemotherapy, methotrexate, biologic injections or transplant medicines? Have you had your spleen removed, or do you have HIV?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", prednisolone, prednisone, dexamethasone, steroids, chemotherapy, chemo, methotrexate, azathioprine, biologic, adalimumab, infliximab, rituximab, tacrolimus, mycophenolate, transplant, spleen, HIV], no_terms: ["no", none, nothing like that, no tablets, not on any]}
    verbatim: true
    negative_reporting: explicit
  - id: fs.immunosuppression_drugs
    class: discriminating
    required: false
    intent: the drug names behind the immunosuppression answer, including oral steroids and their dose in the patient's words
    phrasings:
      - {id: p1, form: open, text: "Which ones? Tell me the names, and roughly what dose you take."}
    value: {type: text}
    evidence: {gap: true, gap_reason: "NICE sepsis guidance lists impaired immunity including oral steroids as a risk-stratification history criterion without a likelihood ratio; no LR for remote history-taking was found in this pass", discriminates: sepsis risk in febrile adults, citation: "NICE sepsis guidance, adult risk-stratification history criteria, as summarised in the Symptom Questioning Library", grade: guideline, population: adults presenting with suspected sepsis, England}
    verbatim: true
    negative_reporting: explicit
  - id: fs.trauma_surgery_6w
    class: coverage
    required: true
    intent: trauma, surgery or an invasive procedure in the last six weeks
    phrasings:
      - {id: p1, form: closed, text: "In the last six weeks, have you had an operation, an injury, or any procedure such as a catheter, a drip line, a scope or an injection into a joint?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", operation, surgery, injury, catheter, line, drip, scope, biopsy, injection, procedure, fell], no_terms: ["no", nothing, none, no operations, nothing like that]}
    verbatim: true
    negative_reporting: explicit
  - id: fs.skin_signs
    class: red_flag
    required: true
    intent: mottled or ashen skin, blue lips, and a non-blanching rash, as delegated observations by patient or carer; a positive escalates, a negative says nothing about the physiology the agent cannot measure
    phrasings:
      - {id: p1, form: open, text: "Have a look at your skin, or ask whoever is with you to. Is it blotchy or mottled, or a grey, ashen colour? Are the lips blue or grey? Is there a rash that stays visible when you press the side of a clear glass on it? Please check the palms, the soles and inside the lower eyelids as well, and tell me what you see."}
    value:
      type: set
      options:
        - {id: mottled, synonyms: [mottled, blotchy, marbled, patchy, ashen, grey, greyish, pale grey, waxy]}
        - {id: blue_lips, synonyms: [blue lips, lips are blue, grey lips, purple lips, blue around the mouth, bluish]}
        - {id: non_blanching_rash, synonyms: [rash that stays, still there under the glass, doesn't fade, purple spots, pinprick spots, bruise-like rash, spots don't go]}
        - {id: none, synonyms: [none, "no", nothing, looks normal, normal colour, no rash, fades, can't see anything]}
    delegated_observation: true
    verbatim: true
    negative_reporting: explicit
  - id: fs.travel_exposures
    class: coverage
    required: false
    intent: recent travel and exposures, for the routing table's framework rows
    phrasings:
      - {id: p1, form: open, text: "Have you travelled anywhere in the last few months? Has anyone around you been unwell, or have you had contact with animals or bats?"}
    value: {type: text}
    verbatim: true
    negative_reporting: omit
red_flags:
  - id: rf.sepsis_no_urine_18h
    fires_when: "fs.urine_18h == 'yes'"
    tier: immediate
    alert: {include_verbatim: true, template: "Fever with no urine passed for 18 hours or more. Last passed urine {fs.urine_last_pass}; count since yesterday {fs.urine_count_since_yesterday}. Patient said: {verbatim}."}
    suppressible: false
    source: "NICE sepsis guidance: not passing urine in the previous 18 hours is a high-risk criterion; fever and sepsis row build rules"
  - id: rf.sepsis_new_altered_behaviour
    fires_when: "fs.collateral_behaviour == 'yes'"
    tier: immediate
    alert: {include_verbatim: true, template: "Fever with new altered behaviour or mental state reported by a friend or relative; routed to the confusion collateral interview. Patient said: {verbatim}."}
    suppressible: false
    source: "NICE sepsis guidance: history from patient, friend or relative of new altered behaviour or mental state; master list: new confusion with fever"
  - id: rf.sepsis_skin_signs
    fires_when: "'mottled' in fs.skin_signs or 'blue_lips' in fs.skin_signs or 'non_blanching_rash' in fs.skin_signs"
    tier: immediate
    alert: {include_verbatim: true, template: "Fever with mottled or ashen skin, blue lips, or a non-blanching rash reported as a delegated observation. Patient said: {verbatim}."}
    suppressible: false
    source: "Delegated observations table: fever / sepsis row, mottled or ashen skin, blue lips; master list: non-blanching rash with fever"
  - id: rf.sepsis_immunosuppressed
    fires_when: "fs.immunosuppressed == 'yes'"
    tier: same_day
    alert: {include_verbatim: true, template: "Fever in an immunosuppressed patient. Drugs named: {fs.immunosuppression_drugs}. Patient said: {verbatim}."}
    suppressible: false
    source: "NICE sepsis guidance: impaired immune system including oral steroids is a risk-stratification criterion; routing table: immunosuppression"
closing:
  uncertainty: "I can't tell from talking with you what is causing the fever, or how serious it is."
  watch_for: [passing little or no urine, becoming muddled or drowsy, blotchy or grey skin or blue lips, a rash that stays when a glass is pressed on it, breathing fast or struggling to breathe, uncontrollable shaking]
  time_course: "Someone will speak with you today."
  where: "If any of those things happen before then, or you feel you are getting rapidly worse, call an ambulance rather than waiting."
prohibited: [assigning a sepsis risk category, treating a negative delegated observation as reassuring, "asking the patient whether they are passing urine normally instead of a clock time and a count", lowering urgency because a previous doctor has already seen the patient]
gaps: ["Sepsis criteria set (NICE vs local SA Health) is a configurable parameter, not yet set", "Heart rate, blood pressure, respiratory rate and objective mental state are examination findings the agent cannot obtain; the high-risk tier depends on them and the handover must say they were not assessed", "Collateral altered behaviour is a friend or relative's account, attributed to them, not a finding"]
