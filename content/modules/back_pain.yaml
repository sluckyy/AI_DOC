module: back_pain
display_name: back pain
version: 0.1.0
status: grounded
reviewed: false
review_notes: ["The handover wording, given negatives carry no reassurance", "Closing block is a first draft"]
setting: both
activates_on:
  terms: [bad back, back pain, back's gone, my back, spasm, sciatica, shooting down my leg, lower back, back has gone]
slots:
  - id: bp.bladder_bowel
    class: red_flag
    required: true
    intent: trouble controlling the bladder or bowels, asked of everyone with back pain as its own question (dialogue pack 8.2)
    phrasings:
      - {id: p1, form: closed, text: "Have you had any trouble controlling your bladder or bowels?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", can't pass urine, can't pee, can't go, incontinent, incontinence, wet myself, leaking, leaked, accident, accidents, lost control, can't hold it, can't control, soiled, retention, dribbling], no_terms: ["no", none, all normal, nothing like that, no trouble, no problems, both fine]}
    stigmatised: true
    preamble: "The next few questions are personal. They are asked of everyone with back pain, and only the clinician looking after you sees the answers."
    disclosure_group: continence
    verbatim: true
    negative_reporting: explicit
  - id: bp.saddle_numbness
    class: red_flag
    required: true
    intent: saddle numbness between the legs or around the back passage, asked of everyone with back pain as its own question (dialogue pack 8.2)
    phrasings:
      - {id: p1, form: closed, text: "Any numbness between your legs, around the back passage, or where you'd sit on a saddle?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", numb, numbness, pins and needles, tingling, tingly, can't feel, lost feeling, dead down there, less feeling], no_terms: ["no", not numb, feels normal, nothing like that, no numbness, feeling is normal]}
    stigmatised: true
    preamble: "This one is personal too, and it is asked of everyone with back pain."
    disclosure_group: continence
    verbatim: true
    negative_reporting: explicit
  - id: bp.sexual_function
    class: red_flag
    required: true
    intent: change in sexual function since the back pain started, asked of everyone with back pain as its own question (dialogue pack 8.3)
    phrasings:
      - {id: p1, form: closed, text: "Have you noticed any change in sexual function since this started?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", erection, erections, can't climax, lost sensation, numb during, can't feel anything, it's changed, it's different, not working], no_terms: ["no", no change, same as usual, nothing like that, all normal, normal, nothing's changed, hasn't changed]}
    stigmatised: true
    preamble: "And the last of the personal ones, again asked of everyone with back pain."
    disclosure_group: sexual
    verbatim: true
    negative_reporting: explicit
  - id: bp.bilateral_legs
    class: red_flag
    required: true
    intent: symptoms in both legs
    phrasings:
      - {id: p1, form: closed, text: "Is there pain, numbness or weakness going down one leg, or both legs?"}
    value:
      type: enum
      options:
        - {id: both, synonyms: [both, both legs, two legs]}
        - {id: one, synonyms: [one leg, one, left leg, right leg, just one]}
        - {id: none, synonyms: [neither, "no", just my back, not in my legs]}
    verbatim: true
    negative_reporting: explicit
  - id: bp.onset_trauma
    class: coverage
    required: true
    intent: onset and any trauma, including in an older person
    phrasings:
      - {id: p1, form: open, text: "When did it start, and was there a fall, a lift or an injury?"}
    value: {type: text}
    verbatim: true
    negative_reporting: omit
  - id: bp.night_pain
    class: coverage
    required: true
    intent: night pain and pain at rest
    phrasings:
      - {id: p1, form: closed, text: "Does it wake you at night, or hurt even when you are resting?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", wakes me, at night, at rest, all the time, lying down], no_terms: ["no", only when i move, fine at rest, sleep ok]}
    verbatim: true
    negative_reporting: explicit
  - id: bp.fever_weight_loss
    class: coverage
    required: true
    intent: fever, unexplained weight loss
    phrasings:
      - {id: p1, form: closed, text: "Any fever? Have you lost weight without trying?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", fever, lost weight, sweats], no_terms: ["no", no fever, weight is stable]}
    verbatim: true
    negative_reporting: explicit
  - id: bp.cancer_history
    class: discriminating
    required: true
    intent: any history of cancer, ever
    phrasings:
      - {id: p1, form: closed, text: "Have you ever been treated for cancer, even years ago?"}
    value: {type: yes_no}
    extraction: {yes_terms: ["yes", cancer, chemo, radiotherapy, tumour, years ago], no_terms: ["no", never, no cancer]}
    evidence: {lr: "history of cancer gives a post-test probability of spinal malignancy of 33% in ED and 7% in primary care", discriminates: spinal malignancy, citation: "Downie 2013, as tabulated in the Past Medical History evidence base", grade: A, population: mixed settings}
    verbatim: true
    negative_reporting: explicit
  - id: bp.steroids_immune
    class: coverage
    required: true
    intent: steroid use, immunosuppression, intravenous drug use, recent infection
    phrasings:
      - {id: p1, form: closed, text: "Do you take steroids or anything that weakens your immune system? Any recent infection?"}
    value: {type: text}
    verbatim: true
    negative_reporting: explicit
  - id: bp.functional
    class: coverage
    required: true
    intent: functional impact and what has been tried
    phrasings:
      - {id: p1, form: open, text: "What can't you do now that you could before? What have you tried for it?"}
    value: {type: text}
    verbatim: true
    negative_reporting: omit
red_flags:
  - id: rf.cauda_equina
    fires_when: "bp.bladder_bowel == 'yes' or bp.saddle_numbness == 'yes' or bp.sexual_function == 'yes'"
    tier: immediate
    alert: {include_verbatim: true, template: "Bladder or bowel dysfunction, saddle numbness or change in sexual function with back pain: bladder or bowel control {bp.bladder_bowel}, saddle numbness {bp.saddle_numbness}, sexual function {bp.sexual_function}. Patient said: \"{verbatim}\"."}
    suppressible: false
    source: "Master list: bladder or bowel dysfunction, or saddle numbness, with back pain"
  - id: rf.bilateral_leg_symptoms
    fires_when: "bp.bilateral_legs == 'both'"
    tier: same_day
    alert: {include_verbatim: true, template: "Bilateral leg symptoms with back pain. Patient said: \"{verbatim}\"."}
    suppressible: false
    source: "MSK table: bilateral leg symptoms; tier proposed for review"
  - id: rf.back_pain_flags
    fires_when: "bp.fever_weight_loss == 'yes' or bp.cancer_history == 'yes' or bp.night_pain == 'yes'"
    tier: flag
    alert: {include_verbatim: true, template: "Back pain red flag positive (fever, weight loss, cancer history or night pain). Patient said: \"{verbatim}\"."}
    suppressible: false
    source: "MSK table red flags"
closing:
  uncertainty: "I can't tell from talking with you what is causing the back pain."
  watch_for: [trouble passing or holding urine, loss of bowel control, numbness between the legs, weakness in both legs]
  time_course: "Someone will speak with you today."
  where: "If any of those start, call an ambulance rather than waiting."
prohibited: [reporting a negative red-flag screen as reassurance, saying "no red flags", bundling continence, saddle numbness and sexual function into one question]
gaps: ["A negative answer to one or two red-flag questions does not lower the likelihood of serious pathology. No examination of power, sensation or sphincter tone."]
