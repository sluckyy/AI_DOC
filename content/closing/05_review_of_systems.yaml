# Closing section: a quick check through the body (D-37; Build Specification F-10,
# F-16). A full systems review run after saturation because asking is cheap; the
# false-positive load transfers to the handover, not to the patient. The controller
# reconciles silently any positive already in the presenting complaint, sends benign
# positives to the collapsed structured layer, and activates the named presentation
# module for a positive that moves the differential or is a red flag (route_to).
# Weiner 2020: about three quarters of documented ROS negatives in practice were never
# asked; an agent that asks has true documented negatives, so every item is asked of
# everyone and every negative is reported explicitly. A negative here never reassures.
module: review_of_systems
kind: closing
order: 5
display_name: a quick check through the body
version: 0.1.0
status: grounded
reviewed: false
review_notes:
  - "The mental health module is blocked pending specialist sign-off (D-50); the mood and sleep item here has no route and a low-mood positive is surfaced as a flag only, never followed up by the agent"
  - "Item wording per system is a GP reviewer decision; the list per stem is the owner's call on interview length"
  - "Whether the early-pregnancy bleeding item is asked of everyone in the genitourinary sweep, or only where gate.pregnancy_possible applies, is an O&G reviewer decision"
  - "Routing targets are presentation modules under content/modules; the controller has not yet implemented route_to or the silent reconciliation of duplicates"
setting: both
slots:
  - id: ros.cardiorespiratory
    class: coverage
    required: false
    always: true
    intent: heart and lung symptoms in the last few weeks, each named, with a positive routed to its presentation module
    phrasings:
      - {id: ros-cr-v1, form: closed, text: "Now a quick check through the body. In the last few weeks, have you had any of these: chest pain, breathlessness, a racing or thumping heart, a cough, coughing up blood, or swollen ankles?"}
    value:
      type: set
      options:
        - {id: chest_pain, synonyms: ["chest pain", "pain in my chest", "tight chest", "chest tightness", "pressure in my chest"]}
        - {id: breathlessness, synonyms: ["breathless", "breathlessness", "short of breath", "out of breath", "can't catch my breath", "puffed"]}
        - {id: palpitations, synonyms: ["racing heart", "thumping heart", "palpitations", "heart racing", "heart pounding", "fluttering", "skipping beats"]}
        - {id: cough, synonyms: ["cough", "coughing", "a cough", "wheeze", "wheezy"]}
        - {id: coughing_blood, synonyms: ["coughing up blood", "coughed up blood", "blood in my phlegm", "blood when i cough", "bloody sputum"]}
        - {id: ankle_swelling, synonyms: ["swollen ankles", "ankle swelling", "swollen legs", "puffy ankles", "my legs swell", "swollen feet"]}
        - {id: none, synonyms: ["none", "none of those", "no", "nothing like that", "no to all of those"]}
    route_to: {chest_pain: chest_pain, breathlessness: breathlessness, palpitations: palpitations, cough: cough_wheeze, coughing_blood: haemoptysis, ankle_swelling: leg_swelling}
    evidence: {citation: "Mitchell 1992 (cardiopulmonary and GI ROS in 550 admissions, about 5% yield); ROS evidence base, implications for the agent", note: "A positive here is a routing event, not a finding; an unselected positive carries almost no information on its own (Kroenke)"}
    verbatim: true
    negative_reporting: explicit
