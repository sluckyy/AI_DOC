red_flags:
  - id: rf.ros_low_mood
    fires_when: "'low_mood' in ros.mood_sleep"
    tier: flag
    alert: {include_verbatim: true, template: "Low mood reported in the systems review. The mental health section is not live (D-50), so this is surfaced as a flag only and was not explored further. Patient said: {verbatim}."}
    suppressible: false
    source: "ROS evidence base: depression is a case-finding item with independent screening evidence; mental health module blocked pending specialist sign-off (D-50, dialogue pack 10)"
prohibited: ["\"systems review unremarkable\" or any global negative phrase in the handover", treating a negative as reassurance]
gaps:
  - "No study has measured the yield of an AI-conducted systems review against a reference standard (ROS evidence base, gaps)"
  - "ROS-elicited symptoms are a separate stratum in the agreement analysis, so they do not dominate disagreement against the emergency doctors' histories (D-37)"
