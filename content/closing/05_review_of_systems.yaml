        - {id: dysphagia, synonyms: ["trouble swallowing", "hard to swallow", "food sticks", "food gets stuck", "can't swallow", "swallowing"]}
        - {id: none, synonyms: ["none", "none of those", "no", "nothing like that", "no to all of those"]}
    route_to: {abdominal_pain: abdominal_pain, vomiting: vomiting, bowel_change: bowel_habit, blood_in_stool: gi_bleeding, dysphagia: dysphagia}
