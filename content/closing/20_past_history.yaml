    verbatim: true
    negative_reporting: explicit
  - id: pm.rheumatoid
    class: coverage
    required: false
    always: true
    intent: "named-condition sweep, rheumatoid arthritis by care-contact and drug anchor (self-label sensitivity 17.5%, kappa 0.25)"
    phrasings:
      - {id: pm-ra-v1, form: closed, text: "Do you see a rheumatologist? Are you on methotrexate or anything like it?"}
    value: {type: yes_no}
    extraction:
      yes_terms: ["yes", rheumatologist, rheumatoid, methotrexate, arthritis clinic, biologic, humira, enbrel]
