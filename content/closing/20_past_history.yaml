  # 8. Catch-all: closes the section on the patient's own judgement.
  - id: pm.catch_all
    class: coverage
    required: true
    always: true
    intent: "catch-all on the patient's own judgement, closing the section after the checklist"
    phrasings:
      - {id: pm-catch-v1, form: open, text: "Is there anything in your medical history you think I should know about that I haven't asked?"}
    value: {type: text}
    none_terms: ["no", nothing, none, nothing else, not that i can think of, that's everything, that's it]
    verbatim: true
    negative_reporting: explicit
red_flags: []
prohibited:
  - correcting the patient's label at elicitation; record it as given and reconcile in the handover
  - '"no significant past history" or any global negative phrase; the handover lists what was asked and what was said'
  - using a psychiatric diagnosis as a framing descriptor for the patient (D-44)
gaps:
  - "No well-powered validation of ED-obtained past medical history against a reference standard exists; where the agent's history and the record disagree, the handover shows both rather than resolving silently"
  - "The lay anchors are English idiom; fluid tablets and mini-stroke do not translate directly, so the anchors must be built per language rather than translated (N-13)"
  - "Only 15.4% of ED trauma patients aged 75 and over could supply the history without documents or a third party; the cross-cutting bail-out rules end the section early and flag what was not covered"
