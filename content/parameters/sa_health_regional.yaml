# Configurable parameters register for the first deployment. Thresholds and
# routes here are policy, not evidence; owner: to be named (D-45). Every
# conversation records the version of this file.
deployment: sa_health_regional
version: 0.1.0
owner: "to be named"
languages: [en, vi, it, fr, ms, hi]
language_names: {en: English, vi: Vietnamese, it: Italian, fr: French, ms: Malay, hi: Hindi}
continue_after_immediate_alert: false      # D-49
saturation_invitations: 3                  # D-48: Build Spec F-8 says 2, Framework P13 says 3
silence_end_of_turn_ms: 1200               # N-3: adjustable per deployment
alert_acknowledgement_timeout_s: 120       # S-4: unacknowledged alerts escalate further after this
closing_read_back: true                    # D-55: Framework P6/read-back kept; dialogue pack 13.4 says no closing summary; owner to rule
capability_check: true                     # dialogue pack 2: hearing, language offer, someone present
confidentiality:                           # S-12 [TBC governance]: scripted from the deployment's actual position; never a promise
  ed: "What you tell me goes into your hospital record, and the doctors and nurses looking after you can see it. I can't promise more than that, and I won't guess about who else can see the record. Wording pending governance review."
  gp_booking: "What you tell me goes to your GP and into your practice record. I can't promise more than that, and I won't guess about who else can see the record. Wording pending governance review."
escalation:
  ed:
    immediate:
      route: alert_triage
      patient_message: "I'm going to stop here and let the nurse at the desk know about this straight away. Someone will come to you. Please stay where you are."
    same_day:
      route: alert_triage
      patient_message: "I'm going to make sure the nurse at the desk knows about this today."
    flag:
      route: handover_flag
      patient_message: ""
  gp_booking:
    immediate:
      route: live_transfer            # D-42: the call transfers live to the duty GP
      transfer_target: duty_gp        # resolved from DEMO_TRANSFER_NUMBER for the demo; the practice's duty GP line in production
      unanswered: practice_workflow   # the practice routes an unanswered duty GP phone back to reception; not the agent's logic
      patient_message: "I'm going to put you through to the duty doctor now, and I'll pass on what you've told me in your own words. Please stay on the line. If the call drops and you feel worse, call triple zero rather than waiting. Wording pending emergency medicine review."
    same_day:
      route: urgent_gp_appointment_today   # practices hold same-day slots; booking is the practice's workflow
      patient_message: "What you've told me needs to be seen in person today. Please come in to the practice for an urgent appointment today; reception will fit you in."
    flag:
      route: handover_flag
      patient_message: ""
# The nine configurable clinical parameters from the Symptom Questioning Library
# (plus the childbearing range used by the pregnancy gate). Each is policy, not
# evidence. `status: pending` means the owner has not set it; the modules record
# the raw feature (age, sex, exposure) and NEVER embed a threshold, so a pending
# value changes handover annotations only, never what is asked. See
# design/09_owner_decisions_brief.md for the options and the recommended defaults.
clinical_parameters:
  haematuria_referral_age:
    status: pending
    value: null                      # years; NICE 45, AUA 35, Scotland none (null = no age threshold)
    options: [35, 45, null]
    recommended: 45
  bowel_symptom_referral_ages:
    status: pending
    value: {rectal_bleeding: null, change_in_bowel_habit: null, iron_deficiency_anaemia: null}
    recommended: {rectal_bleeding: 50, change_in_bowel_habit: 60, iron_deficiency_anaemia: 60}
  anticoagulated_head_injury_imaging:
    status: pending
    value: null                      # scan_all (NICE) | apply_rule (Canadian CT Head Rule excludes)
    options: [scan_all, apply_rule]
    recommended: scan_all
  soft_tissue_lump_initial_imaging:
    status: pending
    value: null                      # ultrasound_first (UK) | mri_first (European)
    options: [ultrasound_first, mri_first]
    recommended: ultrasound_first
  weight_loss_investigation_thresholds:
    status: pending
    value: {male_age: null, female_age: null}
    recommended: {male_age: 50, female_age: 60}   # 2024 BMJ update; English data
  fatigue_cancer_signal_age:
    status: pending
    value: {male_age: null, female_age: null}
    options: [{male_age: 65, female_age: 80}, {male_age: 70, female_age: null}]
    recommended: {male_age: 65, female_age: 80}
  audit_c:
    status: pending
    positive_threshold: {male: null, female: null}
    recommended_threshold: {male: 4, female: 3}
    standard_drink_grams_alcohol: 10             # Australian standard drink
  sepsis_criteria_set:
    status: pending
    value: null                      # nice_ng51 | sa_health_local
    options: [nice_ng51, sa_health_local]
    recommended: nice_ng51
  bat_exposure_notification_pathway:
    status: pending
    value: null                      # e.g. "SA Health Communicable Disease Control Branch 1300 232 272"; source guidance is Queensland
    recommended: "SA Health Communicable Disease Control Branch, 1300 232 272 (to be confirmed by the owner)"
  childbearing_range:
    status: pending
    value: {min: null, max: null}
    recommended: {min: 12, max: 55}

# D-47: a situational item is asked only where a named recipient for a positive answer exists at the site.
# Set each to null to stop asking it. Owner decision B6 in design/09_owner_decisions_brief.md.
situational_recipients:
  transport: "ED discharge planner / practice nurse (interim, to be confirmed by the site)"
  accommodation: "ED discharge planner / social work (interim, to be confirmed by the site)"
  carer_availability: "ED discharge planner / practice nurse (interim, to be confirmed by the site)"
# D-39: guideline thresholds the handover names when a reported pattern crosses them. Australian guidance, cited.
family_history_thresholds:
  colorectal_category_2: {first_degree_count: 2, or_one_first_degree_under_age: 55, label: "Category 2 (revised national colorectal screening guidelines, MJA 2018): iFOBT 2-yearly from 40, colonoscopy 5-yearly from 50"}
  colorectal_category_3: {first_degree_count: 3, label: "Category 3 (MJA 2018): iFOBT 2-yearly from 35, colonoscopy 5-yearly from 45"}
  breast_moderate_risk: {first_degree_under_age: 50, label: "Moderately increased risk (Cancer Australia / BreastScreen categories): annual mammography from 40"}
  premature_cvd: {male_under_age: 55, female_under_age: 65, label: "Premature CVD in a first-degree relative (2023 Australian CVD guideline): reclassification factor"}

helplines:
  emergency: "000"
  lifeline: "13 11 14"
  beyond_blue: "1300 22 4636"
  healthdirect: "1800 022 222"
disclosure:
  ed: "Hello, I'm Dr Sam. I'm an AI, not a doctor, and I work with the doctors here. Before you see the doctor I'd like to hear, in your own words, what's brought you in today. What you tell me goes to the doctor and nurse looking after you, and to no one else. You can stop at any time and ask for a person instead, and you'll get the same care either way. Is it all right to go on?"
  gp_booking: "Hello, I'm Dr Sam. I'm an AI, not a doctor, and I work with your practice. Before your appointment I'd like to hear, in your own words, what's going on. What you tell me goes to your GP and to no one else. You can stop at any time and ask for a person instead, and you'll get the same care either way. Is it all right to go on?"
