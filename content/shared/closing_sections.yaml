# Closing sections asked of everyone after the presentation modules and the
# shared gating questions (Build Specification lifecycle; dialogue pack 6).
# Medications are captured by name and read back; "patient did not know",
# "not asked" and "none" are three different values (F-17). Past history,
# family, social, functional and review of systems follow in a later slice
# (D-37, D-38, D-39, D-40, D-47).
module: closing_sections
kind: closing
display_name: medicines and allergies
version: 0.1.0
status: grounded
reviewed: false
review_notes: ["Medication stem and read-back wording are verbatim from the dialogue pack 6.1 to 6.4", "Past history, family, social and functional sections not yet built"]
setting: both
slots:
  - id: cs.medications
    class: coverage
    required: true
    always: true
    intent: medicines taken, by name, including over the counter; recorded as said
    phrasings:
      - {id: cs-med-v1, form: open, text: "What medicines do you take? Take your time, including anything you get over the counter."}
      - {id: cs-med-v2, form: open, text: "That's fine. I'll write down that you were unsure. Is there a packet nearby you could read the name from?"}
    value: {type: text}
    verbatim: true
    negative_reporting: explicit
  - id: cs.allergies
    class: coverage
    required: true
    always: true
    intent: allergies or bad reactions to medicines, as what happened and when
    phrasings:
      - {id: cs-all-v1, form: open, text: "Are you allergic to any medicines, or have you had a bad reaction to one? What happened?"}
    value: {type: text}
    verbatim: true
    negative_reporting: explicit
  - id: cs.past_history
    class: coverage
    required: true
    always: true
    intent: past health problems and operations, in the patient's words
    phrasings:
      - {id: cs-pmh-v1, form: open, text: "Have you had any health problems in the past, or any operations?"}
    value: {type: text}
    verbatim: true
    negative_reporting: explicit
prohibited: [inferring a drug or drug class from an adjacent mention, recording "none" when the patient did not know, recording a past diagnosis as a current finding]
gaps: ["Full medication inventory (D-38), allergies as reaction and date, past history, family, social and functional sections are later slices"]
